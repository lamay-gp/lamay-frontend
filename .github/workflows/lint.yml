name: Lint

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  checks:
    name: Run fix-style on PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check lint
        run: npm run lint

      - name: Check formatting
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          mapfile -d '' -t files < <(
            git diff --name-only -z --diff-filter=ACMR "origin/${BASE_REF}...HEAD" -- \
              '*.ts' '*.tsx' '*.js' '*.jsx' '*.json' '*.css' '*.md' '*.html' '*.yml' '*.yaml'
          )

          if ((${#files[@]})); then
            npx prettier --check "${files[@]}"
          else
            echo "No changed files supported by Prettier."
          fi

      - name: Build
        run: npm run build
